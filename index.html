<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخير للشحن</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f6;--sf:#fff;--tx:#13232b;--mu:#5d6f77;--ln:#d9e0e3;--pr:#0b6e6e;--pr2:#e0f0ef;--ac:#f2b705;--dn:#b3382c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171b;--sf:#16232a;--tx:#e8eef0;--mu:#8fa3ab;--ln:#27373f;--pr:#3fb8b0;--pr2:#14302f;--dn:#ef7a6e}}
:root[data-theme="dark"]{--bg:#0e171b;--sf:#16232a;--tx:#e8eef0;--mu:#8fa3ab;--ln:#27373f;--pr:#3fb8b0;--pr2:#14302f;--dn:#ef7a6e}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.in{max-width:1080px;margin:0 auto;padding:0 16px;width:100%}
.brand{display:flex;align-items:baseline;gap:10px;padding-top:12px}
.brand h1{margin:0;font-size:26px;font-weight:700;color:var(--pr);letter-spacing:0}
.brand span{color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:8px 14px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
main{padding:20px 16px;flex:1}
h2{margin:0 0 14px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px 14px}
.st small{display:block;color:var(--mu);font-size:13px}.st b{font-size:22px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px}
.pipe{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;margin:10px 0}
.pipe i{display:block;min-width:6px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mu)}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--mu);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr:last-child td{border-bottom:0}
.bd{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:500;background:color-mix(in srgb,currentColor 14%,transparent);white-space:nowrap}
.mu{color:var(--mu);font-size:13px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;width:100%}
td select{padding:4px 6px;font-size:13px;width:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
.bt{font:inherit;font-weight:700;background:var(--pr);color:#fff;border:0;border-radius:6px;padding:9px 18px;cursor:pointer}
html[data-theme="dark"] .bt,.bt.s{background:var(--pr2);color:var(--pr)}
.bt.s{border:1px solid var(--ln);padding:4px 10px;font-weight:500;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1 1 180px}
.price{background:var(--pr2);border-radius:8px;padding:12px 16px;margin:14px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.price b{font-size:22px;color:var(--pr)}
.tl{margin:14px 0 0;padding:0;list-style:none;position:relative}
.tl li{position:relative;padding:0 28px 18px 0}
.tl li::before{content:"";position:absolute;right:6px;top:8px;bottom:-8px;width:2px;background:var(--ln)}
.tl li:last-child::before{display:none}
.tl li i{position:absolute;right:0;top:6px;width:14px;height:14px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1px var(--ln)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
#lbl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#lbl.on{display:flex}
.label{background:#fff;color:#000;width:100%;max-width:380px;border:2px solid #000;padding:14px;font-size:14px}
.label h3{margin:0 0 6px;display:flex;justify-content:space-between;font-size:18px}
.label hr{border:0;border-top:2px solid #000;margin:8px 0}
.label svg{width:100%;height:60px;display:block}
.label .cod{font-size:22px;font-weight:700;border:2px solid #000;padding:2px 10px;text-align:center;margin-top:8px}
.la{display:flex;gap:8px;justify-content:center;margin-top:10px}
.lg{max-width:380px;margin:40px auto}.lg input{margin-bottom:12px}.lg .bt{width:100%}#who{margin-inline-start:auto;display:flex;gap:8px;align-items:center;font-size:14px}
footer{text-align:center;padding:20px;font-size:13px;color:var(--mu);border-top:1px solid var(--ln);background:var(--sf);margin-top:auto}
@media print{body>*:not(#lbl){display:none!important}#lbl{position:static;background:none;display:block}.la{display:none}.label{max-width:none;border-width:2px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<header><div class="in">
<div class="brand"><h1>الخير</h1><span>إدارة شركة الشحن</span><div id="who"></div></div>
<nav id="nav"></nav></div></header>
<main class="in" id="app"></main>
<footer>تصميم وتطوير: حسام الشويخ</footer>
<div id="toast"></div>
<div id="lbl"><div><div class="label" id="lblbody"></div><div class="la"><button class="bt" onclick="window.print()">طباعة البوليصة</button><button class="bt s" onclick="$('#lbl').classList.remove('on')">إغلاق</button></div></div></div>
<script>
const ST=[["new","تم الإنشاء","#6b7c85"],["picked","تم الاستلام من المرسل","#2a6fb0"],["hub","في مركز الفرز","#8a5cc2"],["out","خرج للتسليم","#c98a00"],["done","تم التسليم","#1c8a4e"],["ret","مرتجع","#b3382c"]];
const ZN=[["القاهرة والجيزة",40],["الإسكندرية والدلتا",55],["القناة وسيناء",70],["الصعيد",75]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stn=k=>ST.find(x=>x[0]===k);
const badge=k=>`<span class="bd" style="color:${stn(k)[2]}">${stn(k)[1]}</span>`;
const num=n=>Number(n||0).toLocaleString("ar-EG");
const money=n=>num(n)+" ج.م";
const fdt=t=>new Date(t).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"});
const price=(z,w,cod)=>ZN[z][1]+Math.max(0,Math.ceil(w||1)-1)*8+Math.round((cod||0)*0.02);

const FB={
  apiKey: "AIzaSyAUYa0v5ofjI1QdiAw25O2kTQD8T-OEoEY",
  authDomain: "sahn-56372.firebaseapp.com",
  projectId: "sahn-56372",
  storageBucket: "sahn-56372.firebasestorage.app",
  messagingSenderId: "1021381452707",
  appId: "1:1021381452707:web:bcb8842fc8f63ff0967016",
  measurementId: "G-C24CETX6QB"
};

const D={u:[],c:[],s:[]};
let RS=[],FN={},db,auth,READY=false,SETUP=true,BOOT=false,unsubs=[];
const mail=u=>u.toLowerCase()+"@khair.app";
let V="dash",Q="",F="",TR="";
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)};
const go=v=>{V=v;render();scrollTo(0,0)};
function render(){
  if(!FB.apiKey||FB.apiKey==="YOUR_API_KEY")V="cfg";
  else if(!READY)V="wait";
  else if(!ME)V=SETUP?"login":"setup"; 
  else if(!can(V))V=tabs()[0];
  const on=!!ME;
  $("#nav").innerHTML=on?tabs().map(v=>`<button class="${v===V?"on":""}" onclick="go('${v}')">${TN[v]}</button>`).join(""):"";
  $("#who").innerHTML=on?`${esc(ME.name)} <span class="bd" style="color:var(--pr)">${ROLE[ME.role]}</span> <button class="bt s" onclick="myPw()">كلمة السر</button> <button class="bt s" onclick="auth.signOut()">خروج</button>`:"";
  $("#app").innerHTML=({cfg,wait,setup,login,dash,list,neu,trk,cou,fin,usr})[V]();
  if(V==="neu")calc();
}
const cname=id=>(D.c.find(c=>c.id==id)||{n:"غير مُسند"}).n;
function rows(S){
  return S.map(x=>`<tr><td><b>${x.id}</b><div class="mu">${fdt(x.h[0].t)}</div></td><td>${esc(x.rn)}<div class="mu">${esc(x.city)}</div></td><td>${badge(x.st)}</td><td>${esc(cname(x.cid))}</td>${cm()?`<td>${x.cod?money(x.cod):"—"}</td>`:""}</tr>`).join("")||`<tr><td colspan="5" class="mu">لا توجد شحنات مطابقة.</td></tr>`;
}
function dash(){
  const S=D.s,c=k=>S.filter(x=>x.st===k).length;
  const act=S.filter(x=>!["done","ret"].includes(x.st)).length;
  const bar=ST.map(s=>c(s[0])?`<i style="flex:${c(s[0])};background:${s[2]}"></i>`:"").join("");
  const leg=ST.map(s=>`<span><b style="background:${s[2]}"></b>${s[1]}: ${num(c(s[0]))}</span>`).join("");
  const load=D.c.map(k=>`<div class="st"><b style="font-size:16px">${esc(k.n)}</b><small>${num(S.filter(x=>x.cid==k.id&&x.st==="out").length)} شحنة خرجت للتسليم</small></div>`).join("");
  return`<h2>لوحة التحكم</h2>
  <div class="stats"><div class="st"><small>إجمالي الشحنات</small><b>${num(S.length)}</b></div><div class="st"><small>قيد التنفيذ</small><b>${num(act)}</b></div><div class="st"><small>تم تسليمها</small><b>${num(c("done"))}</b></div></div>
  <div class="box"><b>مراحل الشحنات الآن</b><div class="pipe">${bar}</div><div class="leg">${leg}</div></div>
  <div class="box"><b>حمل المناديب اليوم</b><div class="cg">${load}</div></div>
  <div class="box"><b>آخر الشحنات</b><div class="tw"><table><tr><th>الرقم</th><th>المستلم</th><th>الحالة</th><th>المندوب</th>${cm()?"<th>التحصيل</th>":""}</tr>${rows([...S].reverse().slice(0,5))}</table></div></div>`;
}
function list(){
  const q=Q.trim().toLowerCase();
  const S=[...D.s].reverse().filter(x=>(!F||x.st===F)&&(!q||[x.id,x.rn,x.rp,x.city,x.sn].join(" ").toLowerCase().includes(q)));
  const tr=S.map(x=>`<tr><td><b>${x.id}</b><div class="mu">${fdt(x.h[0].t)}</div></td><td>${esc(x.rn)}<div class="mu">${esc(x.city)} · ${esc(x.rp)}</div></td>
  <td><select aria-label="الحالة" onchange="setSt('${x.id}',this.value)">${ST.map(s=>`<option value="${s[0]}"${s[0]===x.st?" selected":""}>${s[1]}</option>`).join("")}</select></td>
  <td><select aria-label="المندوب" onchange="setCou('${x.id}',this.value)"><option value="">غير مُسند</option>${D.c.map(k=>`<option value="${k.id}"${k.id==x.cid?" selected":""}>${esc(k.n)}</option>`).join("")}</select></td>
  ${cm()?`<td>${x.cod?money(x.cod):"—"}<div class="mu">الشحن ${money(x.fee)}</div></td>`:""}<td><button class="bt s" onclick="lbl('${x.id}')">بوليصة</button> <button class="bt s" onclick="TR='${x.id}';go('trk')">تتبع</button></td></tr>`).join("")||`<tr><td colspan="6" class="mu">لا توجد شحنات مطابقة. جرّب تغيير البحث أو الفلتر.</td></tr>`;
  return`<h2>الشحنات (${num(S.length)})</h2><div class="bar"><input id="q" placeholder="ابحث بالرقم أو الاسم أو الهاتف أو المدينة" value="${esc(Q)}" oninput="Q=this.value;keep()"><select onchange="F=this.value;render()"><option value="">كل الحالات</option>${ST.map(s=>`<option value="${s[0]}"${s[0]===F?" selected":""}>${s[1]}</option>`).join("")}</select></div>
  <div class="box tw"><table><tr><th>الرقم</th><th>المستلم</th><th>الحالة</th><th>المندوب</th>${cm()?"<th>التحصيل</th>":""}<th></th></tr>${tr}</table></div>`;
}
function keep(){const p=$("#q").selectionStart;render();const e=$("#q");e.focus();e.setSelectionRange(p,p)}
const FV=()=>firebase.firestore.FieldValue;
const fail=e=>{console.error(e);toast("تعذّر الحفظ. تأكد من الصلاحيات والاتصال")};
function setSt(id,s){if(!can("list"))return;db.doc("shipments/"+id).update({st:s,h:FV().arrayUnion({s,t:Date.now()})}).then(()=>toast("تم تحديث الحالة"),fail)}
function setCou(id,c){if(!can("list"))return;db.doc("shipments/"+id).update({cid:c||null}).then(()=>toast("تم إسناد الشحنة"),fail)}
function neu(){
  return`<h2>شحنة جديدة</h2><div class="box"><div class="fg">
  <div><label>اسم المرسل</label><input id="sn"></div><div><label>هاتف المرسل</label><input id="sp" inputmode="tel"></div>
  <div><label>اسم المستلم</label><input id="rn"></div><div><label>هاتف المستلم</label><input id="rp" inputmode="tel"></div>
  <div><label>منطقة التوصيل</label><select id="z" onchange="calc()">${ZN.map((z,i)=>`<option value="${i}">${z[0]}</option>`).join("")}</select></div>
  <div><label>العنوان بالتفصيل</label><input id="ct"></div>
  <div><label>الوزن (كجم)</label><input id="w" type="number" min="0.1" step="0.1" value="1" oninput="calc()"></div>
  <div><label>المبلغ المطلوب تحصيله (ج.م)</label><input id="cd" type="number" min="0" value="0" oninput="calc()"></div>
  ${can("cou")?`<div><label>المندوب</label><select id="cu"><option value="">إسناد لاحقًا</option>${D.c.map(k=>`<option value="${k.id}">${esc(k.n)}</option>`).join("")}</select></div>`:""}</div>
  ${cm()?`<div class="price"><span>تكلفة الشحن: أول كجم مشمول، وكل كجم إضافي ٨ ج.م، ورسوم التحصيل ٢٪</span><b id="pr"></b></div>`:""}
  <button class="bt" onclick="add()">إنشاء الشحنة</button></div>`;
}
function calc(){const e=$("#pr");if(e)e.textContent=money(price(+$("#z").value,+$("#w").value,+$("#cd").value))}
async function add(){
  if(!can("neu"))return;
  const g=i=>$("#"+i).value.trim();
  if(!g("sn")||!g("rn")||!g("rp")||!g("ct")){toast("أكمل اسم المرسل والمستلم وهاتفه والعنوان");return}
  const z=+g("z"),w=+g("w")||1,cod=+g("cd")||0,cu=$("#cu");
  try{
    const n=await db.runTransaction(async t=>{const r=db.doc("meta/counter"),d=await t.get(r),v=(d.exists?d.data().n:100000)+1;t.set(r,{n:v});return v});
    const id="KH-"+n,o={sn:g("sn"),sp:g("sp"),rn:g("rn"),rp:g("rp"),city:g("ct"),z,w,cid:cu&&cu.value?cu.value:null,st:"new",h:[{s:"new",t:Date.now()}],by:ME.id};
    const b=db.batch();b.set(db.doc("shipments/"+id),o);b.set(db.doc("finance/"+id),{fee:price(z,w,cod),cod});await b.commit();
    toast("تم تسجيل الشحنة "+id);
    if(can("trk")){TR=id;go("trk")}else{render();lbl(id,{...o,id,cod})}
  }catch(e){fail(e)}
}
function trk(){
  const x=D.s.find(s=>s.id===TR.trim().toUpperCase());
  let out="";
  if(TR&&!x)out=`<div class="box">لم نجد شحنة بهذا الرقم. تأكد من الرقم (مثال: KH-100001).</div>`;
  if(x)out=`<div class="box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b style="font-size:18px">${x.id}</b>${badge(x.st)}</div>
  <p class="mu">من ${esc(x.sn)} إلى ${esc(x.rn)} · ${esc(x.city)} · ${ZN[x.z][0]} · ${num(x.w)} كجم${cm()&&x.cod?" · تحصيل "+money(x.cod):""} · المندوب: ${esc(cname(x.cid))}</p>
  <ul class="tl">${[...x.h].reverse().map(e=>`<li><i style="background:${stn(e.s)[2]}"></i><b>${stn(e.s)[1]}</b><div class="mu">${fdt(e.t)}</div></li>`).join("")}</ul>
  <button class="bt s" onclick="lbl('${x.id}')">طباعة البوليصة</button></div>`;
  return`<h2>تتبع شحنة</h2><div class="bar"><input id="tn" placeholder="أدخل رقم الشحنة، مثال KH-100001" value="${esc(TR)}" onkeydown="if(event.key==='Enter'){TR=this.value;render()}"><button class="bt" style="flex:0 0 auto" onclick="TR=$('#tn').value;render()">بحث</button></div>${out}`;
}
function cou(){
  return`<h2>المناديب</h2><div class="box"><div class="fg"><div><label>اسم المندوب</label><input id="kn"></div><div><label>الهاتف</label><input id="kp" inputmode="tel"></div><div><label>منطقة العمل</label><input id="ka"></div></div><div style="margin-top:12px"><button class="bt" onclick="addC()">إضافة مندوب</button></div></div>
  <div class="cg">${D.c.map(k=>{const S=D.s.filter(x=>x.cid==k.id);return`<div class="st"><b>${esc(k.n)}</b><small>${esc(k.p)} · ${esc(k.a)}</small><small>${num(S.filter(x=>!["done","ret"].includes(x.st)).length)} نشطة · ${num(S.filter(x=>x.st==="done").length)} مُسلَّمة</small></div>`}).join("")}</div>`;
}
function addC(){
  if(!can("cou"))return;
  const n=$("#kn").value.trim();if(!n){toast("اكتب اسم المندوب");return}
  db.collection("couriers").add({n,p:$("#kp").value.trim(),a:$("#ka").value.trim()}).then(()=>{toast("تمت إضافة المندوب");$("#kn").value=""},fail);
}
function lbl(id,o){
  const x=o||D.s.find(s=>s.id===id);let px=0,bars="";
  for(const ch of x.id){const w=1+ch.charCodeAt(0)%3;bars+=`<rect x="${px}" y="0" width="${w}" height="60"/>`;px+=w+1+ch.charCodeAt(0)%2}
  $("#lblbody").innerHTML=`<h3><span>الخير للشحن</span><span>${x.id}</span></h3><svg viewBox="0 0 ${px} 60" preserveAspectRatio="none" fill="#000">${bars}</svg><hr>
  <div><b>إلى:</b> ${esc(x.rn)} — ${esc(x.rp)}</div><div>${esc(x.city)} (${ZN[x.z][0]})</div><hr>
  <div><b>من:</b> ${esc(x.sn)} ${esc(x.sp)}</div><div>الوزن: ${num(x.w)} كجم</div>
  <div class="cod">${x.cod?"تحصيل: "+money(x.cod):"مدفوعة مسبقًا"}</div>`;
  $("#lbl").classList.add("on");
}

let ME=null;
const ROLE={owner:"مالك",admin:"أدمن",emp:"موظف"};
const TN={dash:"لوحة التحكم",list:"الشحنات",neu:"شحنة جديدة",trk:"تتبع شحنة",cou:"المناديب",fin:"الحسابات",usr:"المستخدمون"};
const tabs=()=>!ME?[]:ME.role==="owner"?["dash","list","neu","trk","cou","fin","usr"]:ME.role==="admin"?["dash","list","neu","trk","cou"]:["neu"];
const can=v=>tabs().includes(v);
const cm=()=>!!ME&&(ME.role==="owner"); 
const isO=()=>!!ME&&ME.role==="owner";
function soft(){
  const v={};document.querySelectorAll("#app input[id],#app select[id]").forEach(e=>v[e.id]=e.type==="checkbox"?e.checked:e.value);
  const f=document.activeElement&&document.activeElement.id;render();
  for(const k in v){const e=document.getElementById(k);if(e){if(e.type==="checkbox")e.checked=v[k];else e.value=v[k]}}
  if(f){const e=document.getElementById(f);if(e)e.focus()}
}
function merge(){D.s=RS.map(x=>({fee:0,cod:0,h:[{t:0}],...x,...(FN[x.id]||{})}));D.s.sort((a,b)=>a.h[0].t-b.h[0].t);soft()}
function init(){
  if(!FB.apiKey||FB.apiKey==="YOUR_API_KEY"){render();return}
  firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();auth.onAuthStateChanged(onAuth);
}
async function onAuth(u){
  if(BOOT)return;
  unsubs.forEach(f=>f());unsubs=[];ME=null;D.s=[];D.c=[];D.u=[];RS=[];FN={};
  try{
    if(!u){SETUP=(await db.doc("meta/setup").get()).exists;READY=true;return render()}
    const p=await db.doc("users/"+u.uid).get();
    if(!p.exists||!p.data().active){await auth.signOut();toast("هذا الحساب غير مفعّل. تواصل مع المالك");return}
    ME={id:u.uid,...p.data()};V=tabs()[0];READY=true;
    const sub=(q,fn)=>unsubs.push(q.onSnapshot(fn,e=>console.error(e)));
    if(ME.role!=="emp"){
      sub(db.collection("shipments"),s=>{RS=s.docs.map(d=>({id:d.id,...d.data()}));merge()});
      sub(db.collection("couriers"),s=>{D.c=s.docs.map(d=>({id:d.id,...d.data()}));soft()});
    }
    if(cm())sub(db.collection("finance"),s=>{FN={};s.docs.forEach(d=>FN[d.id]=d.data());merge()});
    if(isO())sub(db.collection("users"),s=>{D.u=s.docs.map(d=>({id:d.id,...d.data()}));soft()});
    render();
  }catch(e){console.error(e);READY=true;render();toast("تعذّر الاتصال بـ Firebase")}
}
const cfg=()=>`<div class="box lg" style="max-width:560px"><h2>إعداد Firebase</h2><p>ضع إعدادات مشروعك في الثابت <b>FB</b> أعلى الكود. ثم فعّل Authentication (Email/Password) وأنشئ قاعدة Firestore، وانسخ قواعد الأمان من الملف <b>firestore.rules</b>.</p></div>`;
const wait=()=>`<p class="mu">جارٍ التحميل…</p>`;

function setup(){return`<div class="box lg"><h2>إنشاء حساب المالك (حسام)</h2><p class="mu">هذا أول تشغيل للمنصة. سيتم إنشاء حسابك كمالك للمنصة بكل الصلاحيات.</p><label>الاسم</label><input id="an" value="حسام الشويخ"><label>اسم المستخدم (إنجليزي)</label><input id="au" value="hossam" autocomplete="username"><label>كلمة السر</label><input id="ap" type="password" value="972004" autocomplete="new-password"><button class="bt" onclick="doSetup()">إنشاء الحساب</button></div>`}
async function doSetup(){
  const n=$("#an").value.trim(),u=$("#au").value.trim(),p=$("#ap").value;
  if(!n||!/^[a-z0-9._-]+$/i.test(u)||p.length<6){toast("أكمل الاسم، واسم مستخدم بالإنجليزية، وكلمة سر من ٦ أحرف");return}
  BOOT=true;
  try{
    const c=await auth.createUserWithEmailAndPassword(mail(u),p),b=db.batch();
    b.set(db.doc("users/"+c.user.uid),{name:n,username:u.toLowerCase(),role:"owner",money:true,active:true});
    b.set(db.doc("meta/setup"),{done:true});await b.commit();
    BOOT=false;await onAuth(c.user);
  }catch(e){BOOT=false;toast("تعذّر إنشاء الحساب: "+(e.code||""))}
}

function login(){return`<div class="box lg"><h2>تسجيل الدخول</h2><label>اسم المستخدم</label><input id="lu" autocomplete="username"><label>كلمة السر</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="bt" onclick="doLogin()">دخول</button></div>`}

function doLogin(){
  const u=$("#lu").value.trim();
  auth.signInWithEmailAndPassword(mail(u),$("#lp").value).catch(()=>toast("اسم المستخدم أو كلمة السر غير صحيحة"));
}

function myPw(){
  const p=prompt("كلمة السر الجديدة (٦ أحرف على الأقل)");if(!p)return;
  if(p.length<6){toast("٦ أحرف على الأقل");return}
  auth.currentUser.updatePassword(p).then(()=>toast("تم تغيير كلمة السر"),()=>toast("سجّل الخروج وادخل من جديد ثم أعد المحاولة"));
}

function fin(){
  const S=[...D.s].reverse(),tf=S.reduce((a,x)=>a+x.fee,0),tc=S.reduce((a,x)=>a+x.cod,0);
  const tr=S.map(x=>`<tr><td><b>${x.id}</b><div class="mu">${esc(x.rn)}</div></td><td>${badge(x.st)}</td><td><input type="number" min="0" id="c${x.id}" value="${x.cod}" onchange="setFin('${x.id}')" style="width:110px;padding:4px 6px" ${isO()?"":"disabled"}></td><td><input type="number" min="0" id="f${x.id}" value="${x.fee}" onchange="setFin('${x.id}')" style="width:110px;padding:4px 6px" ${isO()?"":"disabled"}></td></tr>`).join("")||`<tr><td colspan="4" class="mu">لا توجد فواتير بعد.</td></tr>`;
  return`<h2>الحسابات</h2><div class="stats"><div class="st"><small>إجمالي الشحن</small><b>${money(tf)}</b></div><div class="st"><small>إجمالي التحصيل</small><b>${money(tc)}</b></div></div>
  <div class="box tw"><table><tr><th>الفاتورة</th><th>الحالة</th><th>التحصيل (ج.م)</th><th>سعر الشحن (ج.م)</th></tr>${tr}</table></div><p class="mu">${isO()?"عدّل أي رقم وسيُحفظ تلقائيًا.":"للمالك فقط صلاحية تعديل الأرقام."}</p>`;
}
function setFin(id){
  if(!isO())return;
  db.doc("finance/"+id).set({fee:+$("#f"+id).value||0,cod:+$("#c"+id).value||0}).then(()=>toast("تم حفظ السعر"),fail);
}
function usr(){
  const tr=D.u.map(k=>{const me=k.id===ME.id;
    const role=me?`<span class="bd" style="color:var(--pr)">${ROLE[k.role]}</span>`:`<select aria-label="الدور" onchange="uRole('${k.id}',this.value)"><option value="admin"${k.role==="admin"?" selected":""}>أدمن</option><option value="emp"${k.role==="emp"?" selected":""}>موظف</option></select>`;
    const act=me?"":`<button class="bt s" onclick="uActive('${k.id}',${!k.active})">${k.active?"تعطيل الحساب":"تفعيل الحساب"}</button>`;
    return`<tr><td><b>${esc(k.name)}</b><div class="mu">${esc(k.username)}${k.active?"":" · معطّل"}</div></td><td>${role}</td><td>${act}</td></tr>`}).join("");
  return`<h2>المستخدمون والصلاحيات</h2>
  <div class="box"><div class="fg"><div><label>الاسم</label><input id="nn"></div><div><label>اسم المستخدم (إنجليزي)</label><input id="nu"></div><div><label>كلمة السر</label><input id="np" type="password" autocomplete="new-password"></div>
  <div><label>الدور</label><select id="nr"><option value="emp">موظف</option><option value="admin">أدمن</option></select></div></div>
  <div style="margin-top:12px"><button class="bt" onclick="addU()">إضافة مستخدم</button></div></div>
  <div class="box tw"><table><tr><th>المستخدم</th><th>الدور</th><th></th></tr>${tr}</table></div>`;
}
async function addU(){
  if(!isO())return;
  const n=$("#nn").value.trim(),u=$("#nu").value.trim().toLowerCase(),p=$("#np").value,r=$("#nr").value;
  if(!n||!/^[a-z0-9._-]+$/.test(u)||p.length<6){toast("أكمل الاسم، واسم مستخدم بالإنجليزية، وكلمة سر من ٦ أحرف");return}
  try{
    const a2=firebase.apps.find(a=>a.name==="aux")||firebase.initializeApp(FB,"aux");
    const c=await a2.auth().createUserWithEmailAndPassword(mail(u),p);
    await db.doc("users/"+c.user.uid).set({name:n,username:u,role:r,money:r==="admin",active:true});
    await a2.auth().signOut();toast("تمت إضافة المستخدم");
    ["nn","nu","np"].forEach(i=>$("#"+i).value="");
  }catch(e){toast(e.code==="auth/email-already-in-use"?"اسم المستخدم مستخدم بالفعل":"تعذّر إنشاء الحساب")}
}
function uRole(id,r){if(isO())db.doc("users/"+id).update(r==="admin"?{role:r}:{role:r,money:false}).catch(fail)}
function uActive(id,v){if(isO()&&id!==ME.id)db.doc("users/"+id).update({active:v}).then(()=>toast(v?"تم تفعيل الحساب":"تم تعطيل الحساب"),fail)}
init();
</script>
</body>
</html>
